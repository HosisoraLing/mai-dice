# MaiDice 配置文件

[plugin]
enabled = true

[dice]
# 默认骰子面数
default_faces = 100
# 最大骰子数量
max_dice_count = 100
# 最大骰子面数
max_faces = 10000

[llm_mode]
# 是否启用 LLM 美化模式
enabled = false
# LLM 系统提示词
system_prompt = "你是一个跑团骰娘，风格活泼可爱。请用简短生动的语言描述掷骰结果。"

[napcat]
# 是否启用撤回监听（需要安装 websockets: pip install websockets）
enable_recall_listener = false
# NapCat WebSocket 地址
ws_url = "ws://127.0.0.1:3001"
# NapCat WebSocket Token（如果有的话）
token = ""
